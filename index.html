<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DKit</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0a0a0f;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
    }

    /* grid overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(108,99,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(108,99,255,.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* scanlines */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,.08) 2px,
        rgba(0,0,0,.08) 4px
      );
      pointer-events: none;
    }

    a {
      position: relative;
      z-index: 1;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .35rem;
      width: 180px;
      height: 80px;
      background: #10101a;
      border: 1px solid #1e1e30;
      border-radius: 12px;
      color: #fff;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      overflow: hidden;
      transition: border-color .25s, transform .2s, box-shadow .25s;
    }

    /* inner glow layer */
    a::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(108,99,255,.15), transparent 70%);
      opacity: 0;
      transition: opacity .3s;
    }

    /* corner accent */
    a::after {
      content: '';
      position: absolute;
      top: 8px; right: 8px;
      width: 6px; height: 6px;
      border-top: 1px solid #3a3a5c;
      border-right: 1px solid #3a3a5c;
      transition: border-color .25s;
    }

    a:hover {
      border-color: #6c63ff;
      transform: translateY(-3px);
      box-shadow: 0 0 30px rgba(108,99,255,.25), 0 8px 24px rgba(0,0,0,.5);
    }

    a:hover::before { opacity: 1; }
    a:hover::after  { border-color: #6c63ff; }

    /* HEN purple variant */
    .hen::before {
      background: radial-gradient(ellipse at 50% 0%, rgba(157,78,221,.15), transparent 70%);
    }

    .hen:hover {
      border-color: #9d4edd;
      box-shadow: 0 0 30px rgba(157,78,221,.25), 0 8px 24px rgba(0,0,0,.5);
    }

    .hen:hover::after { border-color: #9d4edd; }

    .sub {
      font-family: 'Share Tech Mono', monospace;
      font-size: .6rem;
      color: #5a5a7a;
      letter-spacing: .15em;
    }

    @media (max-width: 420px) {
      body { flex-direction: column; }
    }
  </style>
</head>
<body>
  <a href="https://koli41jb.github.io/Activate/">
    Activate
    <span class="sub">RUN EXPLOIT</span>
  </a>

  <a href="https://koli41jb.github.io/HEN/" class="hen">
    HEN
    <span class="sub">HOMEBREW ENABLER</span>
  </a>
</body>
</html>
